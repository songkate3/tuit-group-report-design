<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>튜잇 그룹수업 리포트 디자인</title>
<style>
:root{--ink:#15232A;--sub:#56656D;--line:#DDE3E7;--bg:#EEF2F4;--accent:#0B7A75;--bar:56px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
header{height:var(--bar);display:flex;align-items:center;gap:16px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0;white-space:nowrap}
.tabs,.modes,.jump{display:flex;gap:4px;align-items:center}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;min-height:34px}
button:hover{border-color:#9FB0B8}
button[aria-pressed="true"],button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.jump button{min-width:34px;padding:6px 8px}
.jump span,.modes span{font-size:13px;color:var(--sub);margin-right:2px}
.spacer{flex:1}
.sync{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px;white-space:nowrap}
main{height:calc(100% - var(--bar))}
.view{height:100%;display:none}
.view.on{display:flex}
#report{gap:20px;padding:16px 20px 0;justify-content:center}
.col{display:flex;flex-direction:column;min-width:0;height:100%}
.col h2{font-size:13px;font-weight:600;color:var(--sub);margin:0 0 8px 2px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;border:1px solid var(--line);border-radius:14px 14px 0 0;background:#F2F5F7}
#colM{flex:0 0 auto}
#colP{flex:1 1 auto}
.stage{position:relative;overflow:hidden;margin:0 auto}
.stage iframe{border:0;display:block;transform-origin:0 0;position:absolute;top:0}
#guide{padding:16px 20px 0;justify-content:center}
#guide .col{width:100%;max-width:1160px}
body.onlyM #colP,body.onlyP #colM{display:none}
body.onlyM #report{justify-content:center}
@media (max-width:900px){h1{display:none}.jump span,.modes span{display:none}}
</style>
</head>
<body>
<header>
  <h1>튜잇 그룹수업 리포트 디자인</h1>
  <div class="tabs" role="tablist" aria-label="화면 종류">
    <button role="tab" id="tabReport" aria-selected="true" aria-controls="report">리포트 화면</button>
    <button role="tab" id="tabGuide" aria-selected="false" aria-controls="guide">디자인 가이드</button>
  </div>
  <div class="modes" id="modes" aria-label="보기 방식">
    <span>보기</span>
    <button data-mode="both" aria-pressed="true">나란히</button>
    <button data-mode="onlyM" aria-pressed="false">모바일만</button>
    <button data-mode="onlyP" aria-pressed="false">PC만</button>
  </div>
  <div class="jump" id="jump" aria-label="장 바로가기" hidden>
    <span>장</span>
  </div>
  <div class="spacer"></div>
  <label class="sync" id="syncWrap"><input type="checkbox" id="sync" checked> 같이 스크롤</label>
</header>
<main>
  <section class="view on" id="report" role="tabpanel" aria-labelledby="tabReport">
    <div class="col" id="colM">
      <h2>모바일 · 390px</h2>
      <div class="scroll" id="scM"><div class="stage" id="stM"><iframe id="ifM" title="모바일 리포트" src="mobile/Final_v3.dc.html" scrolling="no"></iframe></div></div>
    </div>
    <div class="col" id="colP">
      <h2>PC · 1440px <span id="pcScale"></span></h2>
      <div class="scroll" id="scP"><div class="stage" id="stP"><iframe id="ifP" title="PC 리포트" src="pc/Final_PC_v3.dc.html" scrolling="no"></iframe></div></div>
    </div>
  </section>
  <section class="view" id="guide" role="tabpanel" aria-labelledby="tabGuide">
    <div class="col">
      <h2>디자인 가이드 v1.1 · 1120px <span id="gScale"></span></h2>
      <div class="scroll" id="scG"><div class="stage" id="stG"><iframe id="ifG" title="디자인 가이드" data-src="guide/Guide.dc.html" scrolling="no"></iframe></div></div>
    </div>
  </section>
</main>
<script>
// 각 화면의 원본 크기(캔버스 프레임과 같음). 캔버스에서 다시 내려받아 길이가 바뀌면 h만 고치면 됩니다.
var B = {
  M: { w: 390,  h: 8130, crop: 390 },
  P: { w: 1440, h: 7300, crop: 880 },   // PC는 가운데 880px만 보여 줌(양옆 회색 여백 제외)
  G: { w: 1120, h: 8390, crop: 1120 }
};
var $ = function (id) { return document.getElementById(id); };
var mode = 'both', chapters = { M: null, P: null };

function fit(k, avail) {
  var b = B[k], s = Math.min(1, avail / b.crop);
  var st = $('st' + k), f = $('if' + k);
  st.style.width = Math.round(b.crop * s) + 'px';
  st.style.height = Math.round(b.h * s) + 'px';
  f.style.width = b.w + 'px'; f.style.height = b.h + 'px';
  f.style.left = Math.round(-(b.w - b.crop) / 2 * s) + 'px';
  f.style.transform = 'scale(' + s + ')';
  b.s = s; return s;
}
function layout() {
  var pad = 40, gap = 20, W = window.innerWidth - pad;
  if ($('report').classList.contains('on')) {
    if (mode === 'onlyM') { fit('M', Math.min(W - 20, 390)); }
    else if (mode === 'onlyP') { var s = fit('P', W - 20); $('pcScale').textContent = s < 1 ? '(' + Math.round(s * 100) + '% 축소)' : ''; }
    else {
      var mW = Math.min(390, Math.max(260, W * 0.3));
      fit('M', mW);
      var s2 = fit('P', W - Math.round(B.M.crop * B.M.s) - gap - 24);
      $('pcScale').textContent = s2 < 1 ? '(' + Math.round(s2 * 100) + '% 축소)' : '';
    }
  } else {
    var s3 = fit('G', Math.min(W - 20, 1140));
    $('gScale').textContent = s3 < 1 ? '(' + Math.round(s3 * 100) + '% 축소)' : '';
  }
}
// 같은 출처(웹 서버·GitHub Pages)에서 열면 장 제목 위치를 읽어 장 단위로 맞춥니다. 파일을 직접 열면(file://) 읽을 수 없어 비율로 맞춥니다.
function readChapters(k) {
  try {
    var d = $('if' + k).contentDocument; if (!d) return null;
    var hs = d.querySelectorAll('h2'); if (hs.length < 3) return null;
    var ys = []; for (var i = 0; i < hs.length; i++) { ys.push(hs[i].getBoundingClientRect().top + (d.defaultView.scrollY || 0) - 70); }
    return ys;
  } catch (e) { return null; }
}
function tryChapters(n) {
  chapters.M = readChapters('M'); chapters.P = readChapters('P');
  if (chapters.M && chapters.P && chapters.M.length === chapters.P.length) {
    var j = $('jump'); if (j.querySelectorAll('button').length === 0) {
      chapters.M.forEach(function (_, i) {
        var b = document.createElement('button'); b.textContent = String(i + 1); b.setAttribute('aria-label', (i + 1) + '장으로 이동');
        b.onclick = function () { go(i); }; j.appendChild(b);
      });
    }
    j.hidden = !$('report').classList.contains('on');
  } else if (n > 0) { setTimeout(function () { tryChapters(n - 1); }, 500); }
}
function go(i) {
  lock = true;
  $('scM').scrollTop = Math.max(0, chapters.M[i] * B.M.s);
  $('scP').scrollTop = Math.max(0, chapters.P[i] * B.P.s);
  setTimeout(function () { lock = false; }, 80);
}
function mapPos(y, from, to) {           // y: 원본 px. 장 경계를 기준으로 구간별 선형 대응
  var a = chapters[from], b = chapters[to];
  if (!a || !b || a.length !== b.length) return y / B[from].h * B[to].h;
  var A = [0].concat(a, [B[from].h]), Bq = [0].concat(b, [B[to].h]);
  for (var i = 0; i < A.length - 1; i++) {
    if (y <= A[i + 1]) { var t = (y - A[i]) / Math.max(1, A[i + 1] - A[i]); return Bq[i] + t * (Bq[i + 1] - Bq[i]); }
  }
  return B[to].h;
}
var lock = false;
function link(from, to) {
  $('sc' + from).addEventListener('scroll', function () {
    if (lock || !$('sync').checked || mode !== 'both') return;
    lock = true;
    var y = this.scrollTop / B[from].s;
    $('sc' + to).scrollTop = mapPos(y, from, to) * B[to].s;
    requestAnimationFrame(function () { lock = false; });
  });
}
link('M', 'P'); link('P', 'M');

document.querySelectorAll('#modes button').forEach(function (b) {
  b.onclick = function () {
    mode = b.dataset.mode;
    document.body.classList.remove('onlyM', 'onlyP'); if (mode !== 'both') document.body.classList.add(mode);
    document.querySelectorAll('#modes button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    $('syncWrap').style.visibility = mode === 'both' ? 'visible' : 'hidden';
    layout();
  };
});
function tab(which) {
  var rep = which === 'report';
  $('report').classList.toggle('on', rep); $('guide').classList.toggle('on', !rep);
  $('tabReport').setAttribute('aria-selected', rep); $('tabGuide').setAttribute('aria-selected', !rep);
  $('modes').style.display = rep ? 'flex' : 'none';
  $('syncWrap').style.display = rep ? 'flex' : 'none';
  $('jump').hidden = !(rep && chapters.M && chapters.P);
  var g = $('ifG'); if (!rep && !g.getAttribute('src')) g.setAttribute('src', g.dataset.src);   // 가이드는 탭을 처음 열 때 불러옴
  layout();
}
$('tabReport').onclick = function () { tab('report'); };
$('tabGuide').onclick = function () { tab('guide'); };
window.addEventListener('resize', layout);
$('ifM').addEventListener('load', function () { tryChapters(10); });
$('ifP').addEventListener('load', function () { tryChapters(10); });
layout();
</script>
</body>
</html>
